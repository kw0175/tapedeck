<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloader</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1830; --card:#141f3a; --card2:#1a2748;
    --line:#243356; --text:#e8edf026; --ink:#e9eef7; --dim:#93a3c4;
    --accent:#5b8cff; --accent2:#7aa2ff; --ok:#3ecf8e; --err:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 600px at 80% -10%, #1b2a52 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #16244a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{margin-bottom:26px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13px;margin-top:5px}

  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.32);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:nth-of-type(2){animation-delay:.06s}
  .card:nth-of-type(3){animation-delay:.12s}

  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px;
        text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  input[type=text],select{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1px solid var(--line); background:#0d1730; color:var(--ink);
    font:inherit; transition:border-color .18s, box-shadow .18s;
  }
  input[type=text]:focus,select:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(91,140,255,.22);
  }
  .row{display:flex;gap:10px;align-items:flex-end}
  .row > div{flex:1;min-width:0}
  .opts{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
  .opts > div{flex:0 0 auto;min-width:120px}

  button{
    padding:11px 20px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    color:#fff;font:inherit;font-weight:600;white-space:nowrap;
    transition:transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .18s, filter .18s;
    box-shadow:0 4px 14px rgba(91,140,255,.32);
  }
  button:hover:not(:disabled){transform:translateY(-1.5px);
    box-shadow:0 7px 20px rgba(91,140,255,.42)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .check{display:flex;align-items:center;gap:8px;color:var(--dim);
         font-size:13px;cursor:pointer;user-select:none;padding-bottom:11px}
  .check input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}

  .hint{font-size:12px;color:var(--dim);margin-top:7px}
  code{background:#0d1730;padding:1px 6px;border-radius:5px;
       font-family:Consolas,monospace;font-size:12px;color:#b9c9ee}

  #panel{display:none}
  #panel.on{display:block}
  .phase{display:flex;justify-content:space-between;align-items:baseline;
         margin-bottom:10px;font-size:13px}
  .phase b{font-weight:600;font-size:15px}
  .bar{height:7px;background:#0d1730;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,var(--accent),#8ab4ff);
         transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .bar.done i{background:linear-gradient(90deg,var(--ok),#6fe0ae)}
  .bar.err i{background:linear-gradient(90deg,var(--err),#ff9b9b)}

  pre{margin:14px 0 0;padding:12px 14px;background:#080f1f;
      border:1px solid var(--line);border-radius:10px;max-height:260px;
      overflow:auto;font-family:Consolas,monospace;font-size:12px;
      color:#9fb3d9;white-space:pre-wrap;word-break:break-word}
  .files{margin-top:12px;display:flex;flex-direction:column;gap:4px}
  .files div{padding:7px 11px;background:#0d1730;border-radius:8px;font-size:13px;
             animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .msg{padding:11px 13px;border-radius:10px;font-size:13px;margin-top:12px}
  .msg.err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);
           color:#ffc2c2}
  .msg.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);
          color:#a5f0cd}

  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Downloader</h1>
    <div class="sub">Paste a link, pick a folder. Splits on chapters automatically.</div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label for="url">Link</label>
        <input id="url" type="text" placeholder="https://soundcloud.com/... or https://youtu.be/..." autofocus>
      </div>
      <button id="go">Download</button>
    </div>

    <div style="margin-top:14px">
      <label for="folder">Destination folder</label>
      <input id="folder" type="text" placeholder="Oasis - MTV Unplugged 1996">
      <div class="hint">Created if it doesn't exist. Relative to <code id="root">…</code>,
        or give a full path inside it.</div>
    </div>

    <div class="opts" style="margin-top:14px">
      <div style="flex:1 1 200px">
        <label for="artist">Artist</label>
        <input id="artist" type="text" placeholder="Oasis">
      </div>
      <div style="flex:1 1 200px">
        <label for="album">Album</label>
        <input id="album" type="text" placeholder="MTV Unplugged 1996">
      </div>
      <div style="flex:0 1 100px">
        <label for="date">Year</label>
        <input id="date" type="text" placeholder="1996">
      </div>
    </div>
    <div class="hint">Leave blank to use the upload's own tags — on YouTube that's
      usually the channel name, not the artist.</div>

    <div class="opts">
      <div>
        <label for="format">Format</label>
        <select id="format">
          <option value="mp3">MP3 (Apple Music)</option>
          <option value="m4a">M4A / AAC</option>
          <option value="flac">FLAC (archive)</option>
        </select>
      </div>
      <div>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate">
          <option value="320">320 kbps</option>
          <option value="256">256 kbps</option>
          <option value="192">192 kbps</option>
        </select>
      </div>
      <label class="check"><input id="split" type="checkbox" checked> Split on chapters</label>
      <label class="check"><input id="playlist" type="checkbox"> Whole playlist</label>
    </div>

    <div id="formErr" class="msg err" style="display:none"></div>
  </div>

  <div class="card" id="panel">
    <div class="phase"><b id="phase">Starting</b><span id="pct">0%</span></div>
    <div class="bar" id="bar"><i></i></div>
    <div id="out" class="msg ok" style="display:none"></div>
    <div id="files" class="files"></div>
    <pre id="log"></pre>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const TOKEN_KEY = 'dl_token';
let timer = null;

function headers(){
  const h = {'Content-Type':'application/json'};
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) h['X-Token'] = t;
  return h;
}

fetch('/api/config').then(r=>r.json()).then(c=>{
  $('root').textContent = c.root;
  if (c.needsToken && !localStorage.getItem(TOKEN_KEY)){
    const t = prompt('Access token');
    if (t) localStorage.setItem(TOKEN_KEY, t.trim());
  }
});

function showErr(m){ const e=$('formErr'); e.textContent=m; e.style.display='block'; }
function clearErr(){ $('formErr').style.display='none'; }

async function start(){
  clearErr();
  const url = $('url').value.trim();
  if (!/^https?:\/\//.test(url)) return showErr('Paste a full http(s) link.');
  if (!$('folder').value.trim())  return showErr('Give the destination folder a name.');

  $('go').disabled = true;
  $('panel').classList.add('on');
  $('files').innerHTML=''; $('log').textContent=''; $('out').style.display='none';
  $('bar').className='bar'; $('bar').firstElementChild.style.width='0';

  let r, j;
  try{
    r = await fetch('/api/jobs', {method:'POST', headers:headers(), body:JSON.stringify({
      url, folder:$('folder').value.trim(), format:$('format').value,
      bitrate:+$('bitrate').value, split:$('split').checked,
      playlist:$('playlist').checked, artist:$('artist').value.trim(),
      album:$('album').value.trim(), date:$('date').value.trim() })});
    j = await r.json();
  }catch(e){ $('go').disabled=false; return showErr('Server unreachable.'); }

  if (!r.ok){ $('go').disabled=false; return showErr(j.error || 'Request rejected.'); }
  poll(j.id);
}

function poll(id){
  clearInterval(timer);
  timer = setInterval(async ()=>{
    let s;
    try{ s = await (await fetch('/api/jobs/'+id,{headers:headers()})).json(); }
    catch(e){ return; }

    $('phase').textContent = s.phase;
    $('pct').textContent = Math.round(s.percent) + '%';
    $('bar').firstElementChild.style.width = Math.max(3, s.percent) + '%';
    $('log').textContent = (s.log||[]).join('\n');
    $('log').scrollTop = $('log').scrollHeight;

    if (s.status === 'running') return;
    clearInterval(timer);
    $('go').disabled = false;

    if (s.status === 'error'){
      $('bar').className = 'bar err';
      $('bar').firstElementChild.style.width = '100%';
      showErr(s.error || 'Job failed - see log.');
      return;
    }
    $('bar').className = 'bar done';
    const audio = (s.files||[]).filter(f => !/\.(jpg|jpeg|png|webp)$/i.test(f));
    $('out').textContent = `${audio.length} track(s) in ${s.output}`;
    $('out').style.display = 'block';
    $('files').innerHTML = '';
    audio.forEach((f,i)=>{
      const d = document.createElement('div');
      d.textContent = f; d.style.animationDelay = (i*0.03)+'s';
      $('files').appendChild(d);
    });
  }, 700);
}

$('go').addEventListener('click', start);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('folder').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
</script>
</body>
</html>
