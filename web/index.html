<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tapedeck</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1830; --card:#141f3a; --card2:#1a2748;
    --line:#243356; --text:#e8edf026; --ink:#e9eef7; --dim:#93a3c4;
    --accent:#5b8cff; --accent2:#7aa2ff; --ok:#3ecf8e; --err:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 600px at 80% -10%, #1b2a52 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #16244a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{margin-bottom:26px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13px;margin-top:5px}

  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:74px;height:64px;color:var(--accent2);flex:0 0 auto;
        filter:drop-shadow(0 3px 10px rgba(91,140,255,.35))}
  /* Breathing lives on the wrapper so it can run while the face itself is
     being transformed - two animations on one transform would fight. */
  .markwrap{position:relative;display:flex;align-items:center;flex:0 0 auto;
            animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}

  /* Z's should look breathed out, not conjured: they start small at the cat's
     muzzle, appear almost instantly, then grow, sway and thin out as they
     rise. Each takes a different path so three of them never look like one
     animation played three times. */
  .zzz{position:absolute;top:38%;right:6px;width:0;height:0;pointer-events:none}
  .zzz i{position:absolute;font-style:italic;font-weight:800;font-size:11px;
         letter-spacing:-.5px;color:var(--accent2);opacity:0;
         animation:hue 9s linear infinite;
         text-shadow:0 1px 6px rgba(91,140,255,.45)}
  body.sleepy .zzz i:nth-child(1){animation:hue 9s linear infinite, zA 3.5s ease-out infinite}
  body.sleepy .zzz i:nth-child(2){animation:hue 9s linear infinite, zB 3.5s ease-out infinite 1.15s}
  body.sleepy .zzz i:nth-child(3){animation:hue 9s linear infinite, zC 3.5s ease-out infinite 2.3s}

  @keyframes zA{
    0%  {opacity:0;  transform:translate(0,0)       scale(.45) rotate(-20deg)}
    8%  {opacity:.95}
    35% {              transform:translate(9px,-13px)  scale(.85) rotate(6deg)}
    68% {opacity:.6;   transform:translate(3px,-25px)  scale(1.15) rotate(-8deg)}
    100%{opacity:0;    transform:translate(12px,-40px) scale(1.5) rotate(12deg)}
  }
  @keyframes zB{
    0%  {opacity:0;  transform:translate(0,0)       scale(.4)  rotate(14deg)}
    9%  {opacity:.9}
    40% {              transform:translate(-4px,-14px) scale(.8)  rotate(-10deg)}
    72% {opacity:.55;  transform:translate(6px,-26px)  scale(1.1) rotate(8deg)}
    100%{opacity:0;    transform:translate(-2px,-41px) scale(1.45) rotate(-6deg)}
  }
  @keyframes zC{
    0%  {opacity:0;  transform:translate(0,0)       scale(.5)  rotate(-6deg)}
    7%  {opacity:.85}
    38% {              transform:translate(5px,-15px)  scale(.9)  rotate(12deg)}
    70% {opacity:.5;   transform:translate(12px,-27px) scale(1.2) rotate(-4deg)}
    100%{opacity:0;    transform:translate(7px,-43px)  scale(1.55) rotate(16deg)}
  }
  /* Colour cycles always; the bob only while a job runs, so motion still
     means something is happening. */
  .mark{transform-origin:50% 60%; animation:hue 9s linear infinite;
        transition:transform .34s cubic-bezier(.34,1.42,.5,1)}
  /* Reacts to you touching a control, so the app feels like it noticed. */
  /* One face at a time. Each expression maps to something the app is doing,
     so the cat is a status indicator rather than decoration. */
  .mouth,.eyes{transition:opacity .26s cubic-bezier(.4,0,.2,1)}
  .mouth{opacity:0}
  .mouth.rest{opacity:1}
  .eyes.wide{opacity:0}

  body.smirk    .mouth{opacity:0} body.smirk    .mouth.smirk{opacity:1}
  body.busy     .mouth{opacity:0} body.busy     .mouth.work {opacity:1}
  body.pleased  .mouth{opacity:0} body.pleased  .mouth.done {opacity:1}
  body.startled .mouth{opacity:0} body.startled .mouth.oops {opacity:1}

  body.smile    .mouth{opacity:0} body.smile    .mouth.smile {opacity:1}
  body.frown    .mouth{opacity:0} body.frown    .mouth.frown {opacity:1}
  body.cross    .mouth{opacity:0} body.cross    .mouth.cross {opacity:1}
  body.sleepy   .mouth{opacity:0} body.sleepy   .mouth.sleepy{opacity:1}

  .brows,.eyes.shut,.eyes.wink{opacity:0;transition:opacity .26s cubic-bezier(.4,0,.2,1)}

  body.wink   .mouth{opacity:0} body.wink   .mouth.smirk {opacity:1}
  body.cheeky .mouth{opacity:0} body.cheeky .mouth.cheeky{opacity:1}
  body.grin   .mouth{opacity:0} body.grin   .mouth.grin  {opacity:1}
  body.wink   .eyes.calm{opacity:0}
  body.wink   .eyes.wink{opacity:1}
  body.cheeky .eyes.calm{transform:scaleY(.86)}
  body.wink   .mark{transform:rotate(-6deg) scale(1.06)}
  body.cheeky .mark{transform:rotate(3deg)  scale(1.05)}
  body.grin   .mark{transform:scale(1.08)}
  body.cross  .brows{opacity:1}
  body.sleepy .eyes.calm{opacity:0}
  body.sleepy .eyes.shut{opacity:1}
  body.startled .eyes.calm{opacity:0}
  body.startled .eyes.wide{opacity:1}

  .eyes{transition:opacity .26s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.34,1.42,.5,1); transform-origin:28px 25px}
  body.smirk .eyes.calm{transform:translateY(-.6px) scaleY(.82)}
  body.busy  .eyes.calm{transform:scaleY(.7)}

  body.smirk    .mark{transform:rotate(-5deg) scale(1.06)}
  body.pleased  .mark{transform:scale(1.1)}
  body.startled .mark{transform:rotate(4deg)}
  body.smile    .mark{transform:scale(1.05)}
  body.cross    .mark{transform:rotate(-2deg) scale(1.04)}
  body.sleepy   .mark{transform:translateY(2px) scale(.97); opacity:.75}
  body.working .mark{animation:hue 9s linear infinite, bob 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes hue{
    0%  {color:#7aa2ff}
    20% {color:#8f7dff}
    40% {color:#ff7ad0}
    60% {color:#ffb36b}
    80% {color:#4fd6b0}
    100%{color:#7aa2ff}
  }
  @keyframes bob{
    0%   {transform:rotate(-3.2deg) translateY(0)}
    28%  {transform:rotate(1.5deg)  translateY(-2.4px)}
    52%  {transform:rotate(3.2deg)  translateY(-1px)}
    78%  {transform:rotate(-1deg)   translateY(-2.6px)}
    100% {transform:rotate(-3.2deg) translateY(0)}
  }

  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.32);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:nth-of-type(2){animation-delay:.06s}
  .card:nth-of-type(3){animation-delay:.12s}

  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px;
        text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  input[type=text],select{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1px solid var(--line); background:#0d1730; color:var(--ink);
    font:inherit; transition:border-color .18s, box-shadow .18s;
  }
  input[type=text]:focus,select:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(91,140,255,.22);
  }
  .row{display:flex;gap:10px;align-items:flex-end}
  .row > div{flex:1;min-width:0}
  .opts{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
  .opts > div{flex:0 0 auto;min-width:120px}

  button{
    padding:11px 20px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    color:#fff;font:inherit;font-weight:600;white-space:nowrap;
    transition:transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .18s, filter .18s;
    box-shadow:0 4px 14px rgba(91,140,255,.32);
  }
  button:hover:not(:disabled){transform:translateY(-1.5px);
    box-shadow:0 7px 20px rgba(91,140,255,.42)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .check{display:flex;align-items:center;gap:8px;color:var(--dim);
         font-size:13px;cursor:pointer;user-select:none;padding-bottom:11px}
  .check input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}

  .hint{font-size:12px;color:var(--dim);margin-top:7px}
  code{background:#0d1730;padding:1px 6px;border-radius:5px;
       font-family:Consolas,monospace;font-size:12px;color:#b9c9ee}

  .barwrap{position:relative;padding-top:26px}
  .flyer{position:absolute;bottom:9px;left:0;width:44px;height:27px;
         transform:translateX(-50%);color:var(--accent2);opacity:0;
         pointer-events:none;
         transition:left .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease}
  .flyer svg{width:100%;height:100%;display:block}
  body.working .flyer{opacity:1;animation:fly 2.1s ease-in-out infinite}
  body.working .prop{animation:propspin .18s linear infinite;
                     transform-origin:40px 15px}
  @keyframes fly{
    0%   {transform:translateX(-50%) translateY(0)     rotate(-3deg)}
    30%  {transform:translateX(-50%) translateY(-4px)  rotate(2deg)}
    62%  {transform:translateX(-50%) translateY(-1px)  rotate(-1deg)}
    100% {transform:translateX(-50%) translateY(0)     rotate(-3deg)}
  }
  @keyframes propspin{to{transform:rotate(360deg)}}

  #panel{display:none}
  #panel.on{display:block}
  .phase{display:flex;justify-content:space-between;align-items:baseline;
         margin-bottom:10px;font-size:13px}
  .phase b{font-weight:600;font-size:15px}
  .bar{height:7px;background:#0d1730;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,var(--accent),#8ab4ff);
         transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .bar.done i{background:linear-gradient(90deg,var(--ok),#6fe0ae)}
  .bar.err i{background:linear-gradient(90deg,var(--err),#ff9b9b)}

  pre{margin:14px 0 0;padding:12px 14px;background:#080f1f;
      border:1px solid var(--line);border-radius:10px;max-height:260px;
      overflow:auto;font-family:Consolas,monospace;font-size:12px;
      color:#9fb3d9;white-space:pre-wrap;word-break:break-word}
  .files{margin-top:12px;display:flex;flex-direction:column;gap:4px}
  .files div{padding:7px 11px;background:#0d1730;border-radius:8px;font-size:13px;
             animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .msg{padding:11px 13px;border-radius:10px;font-size:13px;margin-top:12px}
  .msg.err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);
           color:#ffc2c2}
  .msg.ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);
          color:#a5f0cd}

  button.ghost{background:#0d1730;border:1px solid var(--line);color:var(--ink);
               box-shadow:none;font-weight:500}
  button.ghost:hover:not(:disabled){border-color:var(--accent);
    box-shadow:0 4px 14px rgba(91,140,255,.18)}
  input[readonly]{cursor:default;color:#cfdcf5}

  /* ---- folder browser ---- */
  .back{position:fixed;inset:0;background:rgba(5,9,18,.62);backdrop-filter:blur(7px);
        display:none;align-items:center;justify-content:center;padding:22px;z-index:50}
  .back.on{display:flex;animation:fade .22s ease both}
  .modal{width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.55);
    animation:pop .3s cubic-bezier(.2,.9,.25,1.05) both}
  .mhead{padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead h2{margin:0;font-size:16px;font-weight:650}
  .crumb{margin-top:7px;font-size:12px;color:var(--dim);word-break:break-all;
         font-family:Consolas,monospace}
  .mlist{overflow:auto;padding:8px;flex:1;min-height:130px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
        cursor:pointer;font-size:14px;transition:background .14s,transform .14s;
        animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
  .item:hover{background:#1b2a4d;transform:translateX(2px)}
  .item .ico{opacity:.75}
  .empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}
  .mfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;
         align-items:center;flex-wrap:wrap}
  .mfoot input{flex:1;min-width:150px;padding:9px 11px}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.975)}
                 to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="markwrap">
      <svg class="mark" viewBox="0 0 56 48" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 19 L13 5 L22.5 11.5 C25 10 31 10 33.5 11.5 L43 5 L45 19
                 C47 24 46 33 40 38 C36 41.5 20 41.5 16 38 C10 33 9 24 11 19 Z"/>
        <g class="eyes calm">
          <path d="M17.5 26 Q21 22.2 24.5 26"/>
          <path d="M31.5 26 Q35 22.2 38.5 26"/>
        </g>
        <g class="eyes wide">
          <circle cx="21" cy="24.6" r="3.1"/>
          <circle cx="35" cy="24.6" r="3.1"/>
        </g>
        <path d="M28 30.2 L28 32.2"/>
        <g class="mouth rest">
          <path d="M23.4 33.2 Q25.8 35.2 28 32.2"/>
          <path d="M28 32.2 Q30.2 35.2 32.6 33.2"/>
        </g>
        <g class="mouth smirk">
          <path d="M22.2 32.6 Q25.4 35.4 28 32.2"/>
          <path d="M28 32.2 Q33.2 36 38.4 29.6" stroke-width="3"/>
        </g>
        <g class="mouth work">
          <path d="M24.6 33.6 Q28 32.5 31.4 33.6"/>
        </g>
        <g class="mouth done">
          <path d="M21.8 31.8 Q28 38.8 34.2 31.8"/>
        </g>
        <g class="mouth oops">
          <ellipse cx="28" cy="34" rx="2.5" ry="3"/>
        </g>
        <g class="mouth smile">
          <path d="M21.8 31.4 Q28 37.4 34.2 31.4"/>
        </g>
        <g class="mouth frown">
          <path d="M22.4 35.2 Q28 30.6 33.6 35.2"/>
        </g>
        <g class="mouth cross">
          <path d="M23 35.4 Q28 31.2 33 35.4"/>
        </g>
        <g class="mouth sleepy">
          <path d="M25.2 33.4 Q28 34.9 30.8 33.4"/>
        </g>
        <g class="brows">
          <path d="M16.4 20.2 L24.6 23.4"/>
          <path d="M39.6 20.2 L31.4 23.4"/>
        </g>
        <g class="eyes shut">
          <path d="M17.6 25.4 L24.4 25.4"/>
          <path d="M31.6 25.4 L38.4 25.4"/>
        </g>
        <g class="eyes wink">
          <path d="M17.5 26 Q21 22.2 24.5 26"/>
          <path d="M31.6 25.6 L38.4 25.6"/>
        </g>
        <g class="mouth cheeky">
          <path d="M24.4 32.2 Q28 35.4 31.6 32.2"/>
          <ellipse cx="28.6" cy="35.2" rx="2" ry="2.4"
                   fill="currentColor" stroke="none" opacity=".55"/>
        </g>
        <g class="mouth grin">
          <path d="M21.4 31.2 Q28 38.6 34.6 31.2"/>
          <path d="M24.4 33.4 L31.6 33.4" opacity=".55"/>
        </g>
        <g opacity=".5" stroke-width="2">
          <path d="M7.5 28.5 L14.5 29.4"/>
          <path d="M7.5 33 L14.5 32"/>
          <path d="M48.5 28.5 L41.5 29.4"/>
          <path d="M48.5 33 L41.5 32"/>
        </g>
      </svg>
        <span class="zzz" aria-hidden="true"><i>Z</i><i>Z</i><i>Z</i></span>
      </span>
      <div>
        <h1>tapedeck</h1>
        <div class="sub">Paste a link, pick a folder. Splits on chapters automatically.</div>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label for="url">Link</label>
        <input id="url" type="text" autofocus>
      </div>
      <button id="go">Download</button>
    </div>

    <div style="margin-top:14px">
      <label for="folder">Destination folder</label>
      <div class="row">
        <div><input id="folder" type="text" readonly></div>
        <button id="browse" type="button" class="ghost">Browse…</button>
      </div>
      <div class="hint"><code id="root">…</code></div>
    </div>

    <div class="opts" style="margin-top:14px">
      <div style="flex:1 1 200px">
        <label for="artist">Artist</label>
        <input id="artist" type="text">
      </div>
      <div style="flex:1 1 200px">
        <label for="album">Album</label>
        <input id="album" type="text">
      </div>
      <div style="flex:0 1 100px">
        <label for="date">Year</label>
        <input id="date" type="text">
      </div>
    </div>
    <div class="hint">Leave blank to use the upload's own tags — on YouTube that's
      usually the channel name, not the artist.</div>

    <div class="opts">
      <div>
        <label for="format">Format</label>
        <select id="format">
          <option value="mp3">MP3 (Apple Music)</option>
          <option value="m4a">M4A / AAC</option>
          <option value="flac">FLAC (archive)</option>
        </select>
      </div>
      <div>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate">
          <option value="320">320 kbps</option>
          <option value="256">256 kbps</option>
          <option value="192">192 kbps</option>
        </select>
      </div>
      <label class="check"><input id="split" type="checkbox" checked> Split on chapters</label>
      <label class="check"><input id="playlist" type="checkbox"> Whole playlist</label>
    </div>

    <div id="formErr" class="msg err" style="display:none"></div>
  </div>

  <div class="back" id="back">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
      <div class="mhead">
        <h2 id="mtitle">Choose a folder</h2>
        <div class="crumb" id="crumb">…</div>
      </div>
      <div class="mlist" id="mlist"></div>
      <div class="mfoot">
        <input id="newname" type="text" placeholder="New folder name…">
        <button id="mkdir" type="button" class="ghost">Create</button>
        <span style="flex:1"></span>
        <button id="native" type="button" class="ghost" style="display:none">Explorer…</button>
        <button id="cancel" type="button" class="ghost">Cancel</button>
        <button id="choose" type="button">Use this folder</button>
      </div>
    </div>
  </div>

  <div class="card" id="panel">
    <div class="phase">
      <b id="phase">Starting</b>
      <span>
        <button id="again" type="button" class="ghost" style="display:none;margin-right:10px">New download</button>
        <span id="pct">0%</span>
      </span>
    </div>
    <div class="barwrap">
      <span class="flyer" id="flyer" aria-hidden="true">
        <svg viewBox="0 0 46 28" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 18 Q16 11 30 12 L38 14 Q41 15 38 16.5 L30 18.5 Q16 22 6 18 Z"/>
          <path d="M16 12.5 L21 5 L26 12"/>
          <path d="M9 17.5 L5.5 23 L13 19.5"/>
          <circle cx="27" cy="14" r="4"/>
          <path d="M24.2 11.4 L23.4 8.4 L26.1 10.2"/>
          <path d="M29.8 11.4 L30.6 8.4 L27.9 10.2"/>
          <path d="M25.4 15.2 Q27 16.6 28.6 15.2"/>
          <g class="prop"><path d="M40 10.5 L40 19.5"/></g>
        </svg>
      </span>
      <div class="bar" id="bar"><i></i></div>
    </div>
    <div id="out" class="msg ok" style="display:none"></div>
    <div id="files" class="files"></div>
    <pre id="log"></pre>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const TOKEN_KEY = 'dl_token';
let timer = null;

function headers(){
  const h = {'Content-Type':'application/json'};
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) h['X-Token'] = t;
  return h;
}

// Accept ?token=... so a bookmarked link authenticates itself. localStorage does
// not survive a private window, which otherwise means re-typing the token every
// single visit. Strip it from the address bar straight away so it isn't sitting
// on screen or captured by a later share of the URL.
(function(){
  const u = new URL(location.href);
  const t = u.searchParams.get('token');
  if (t){
    localStorage.setItem(TOKEN_KEY, t.trim());
    u.searchParams.delete('token');
    history.replaceState({}, '', u.pathname + u.search + u.hash);
  }
})();

let ROOT = '';
fetch('/api/config').then(r=>r.json()).then(c=>{
  ROOT = c.root;
  $('root').textContent = c.root;
  // A native dialog opens on the machine running the server, so it's only
  // offered when the browser is on that same machine.
  if (c.canNativePick) $('native').style.display = '';
  if (c.needsToken && !localStorage.getItem(TOKEN_KEY)){
    const t = prompt('Access token');
    if (t) localStorage.setItem(TOKEN_KEY, t.trim());
  }
});

/* ---------------- folder browser ---------------- */
let here = '';

function openBrowser(){ $('back').classList.add('on'); load($('folder').value.trim()); }
function closeBrowser(){ $('back').classList.remove('on'); $('newname').value=''; }

async function load(path, retried){
  const list = $('mlist');
  list.innerHTML = '<div class="empty">Loading…</div>';
  let d;
  try{
    const r = await fetch('/api/browse?path=' + encodeURIComponent(path||''), {headers:headers()});
    // A stale token in localStorage otherwise leaves you stuck reading
    // "bad or missing token" with no way to correct it. Ask once, then retry.
    if (r.status === 401 && !retried){
      forgetTokenAndAsk();
      return load(path, true);
    }
    d = await readJson(r);
    if (!r.ok || !d) throw new Error((d && d.error) || describe(r.status));
  }catch(e){
    list.innerHTML = `<div class="empty">${e.message}</div>`;
    return;
  }
  here = d.path || '';
  $('crumb').textContent = d.absolute;
  list.innerHTML = '';

  if (d.parent !== null && d.parent !== undefined){
    list.appendChild(row('⬆', '.. (up one level)', () => load(d.parent)));
  }
  if (!d.dirs.length && (d.parent === null || d.parent === undefined)){
    list.appendChild(Object.assign(document.createElement('div'),
      {className:'empty', textContent:'No folders yet — create one below.'}));
  }
  d.dirs.forEach((name,i)=>{
    const el = row('📁', name, () => load(here ? here + '/' + name : name));
    el.style.animationDelay = (i*0.02)+'s';
    list.appendChild(el);
  });
}

function row(ico, text, onClick){
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<span class="ico">${ico}</span><span></span>`;
  el.lastElementChild.textContent = text;
  el.addEventListener('click', onClick);
  return el;
}

$('browse').addEventListener('click', openBrowser);
$('cancel').addEventListener('click', closeBrowser);
$('back').addEventListener('click', e => { if (e.target === $('back')) closeBrowser(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('back').classList.contains('on')) closeBrowser();
});

$('choose').addEventListener('click', ()=>{
  $('folder').value = here;
  clearErr();
  closeBrowser();
});

$('mkdir').addEventListener('click', async ()=>{
  const name = $('newname').value.trim();
  if (!name) return;
  try{
    const r = await fetch('/api/mkdir', {method:'POST', headers:headers(),
      body: JSON.stringify({path: here, name})});
    const d = await readJson(r);
    if (!r.ok || !d) throw new Error((d && d.error) || describe(r.status));
    $('newname').value = '';
    await load(d.path);              // drop straight into the new folder
  }catch(e){ $('crumb').textContent = e.message; }
});
$('newname').addEventListener('keydown', e => { if (e.key === 'Enter') $('mkdir').click(); });

$('native').addEventListener('click', async ()=>{
  $('native').disabled = true;
  $('crumb').textContent = 'Dialog open on the PC — pick a folder there…';
  try{
    const r = await fetch('/api/pick', {method:'POST', headers:headers()});
    const d = await readJson(r);
    if (!r.ok || !d) throw new Error((d && d.error) || describe(r.status));
    if (!d.cancelled){ $('folder').value = d.path; closeBrowser(); clearErr(); }
    else load(here);
  }catch(e){ $('crumb').textContent = e.message; }
  finally{ $('native').disabled = false; }
});

function showErr(m){ const e=$('formErr'); e.textContent=m; e.style.display='block';
  if (typeof mood === 'function' && !STATUS.some(x=>document.body.classList.contains(x)))
    mood('frown', 2200); }
function clearErr(){ $('formErr').style.display='none'; }

// When the PC is down or restarting, the tunnel returns an HTML error page and
// r.json() throws a bare SyntaxError. Read the body once and parse defensively so
// the page can say something useful instead.
async function readJson(r){
  let text = '';
  try { text = await r.text(); } catch { return null; }
  if (!text) return null;
  try { return JSON.parse(text); } catch { return null; }
}

function describe(status){
  if (status === 401) return 'Wrong or missing access token.';
  if (status === 502) return 'Your PC is not answering — is server.py running?';
  if (status === 503) return 'No machine registered — start server.py and tunnel.py at home.';
  if (status >= 500) return `The machine returned an error (HTTP ${status}).`;
  return `Request failed (HTTP ${status}).`;
}

// A stale token in localStorage otherwise locks you out with no way back.
function forgetTokenAndAsk(){
  localStorage.removeItem(TOKEN_KEY);
  const t = prompt('Access token');
  if (t) localStorage.setItem(TOKEN_KEY, t.trim());
}

async function start(){
  clearErr();
  const url = $('url').value.trim();
  if (!/^https?:\/\//.test(url)) return showErr('Paste a full http(s) link.');
  if (!$('folder').value.trim())  return showErr('Give the destination folder a name.');

  $('go').disabled = true;
  document.body.classList.add('working');
  mood('busy');
  $('again').style.display = 'none';
  $('panel').classList.add('on');
  $('files').innerHTML=''; $('log').textContent=''; $('out').style.display='none';
  $('bar').className='bar'; $('bar').firstElementChild.style.width='0';
  $('flyer').style.left = '0%';

  let r, j;
  try{
    r = await fetch('/api/jobs', {method:'POST', headers:headers(), body:JSON.stringify({
      url, folder:$('folder').value.trim(), format:$('format').value,
      bitrate:+$('bitrate').value, split:$('split').checked,
      playlist:$('playlist').checked, artist:$('artist').value.trim(),
      album:$('album').value.trim(), date:$('date').value.trim() })});
    j = await readJson(r);
  }catch(e){
    $('go').disabled=false; $('panel').classList.remove('on');
    return showErr('Could not reach the server — check your connection.');
  }

  if (!r.ok){
    $('go').disabled = false;
    $('panel').classList.remove('on');
    if (r.status === 401) forgetTokenAndAsk();
    return showErr((j && j.error) || describe(r.status));
  }
  if (!j || !j.id){
    $('go').disabled = false; $('panel').classList.remove('on');
    return showErr('The server replied with something unexpected.');
  }
  poll(j.id);
}

function poll(id){
  clearInterval(timer);
  let misses = 0;
  timer = setInterval(async ()=>{
    let s = null, r = null;
    try{
      r = await fetch('/api/jobs/'+id, {headers:headers()});
      s = await readJson(r);
    }catch(e){ /* handled by the miss counter below */ }

    // The job keeps running on the PC even if the page loses contact, so ride out
    // brief blips rather than declaring failure on the first one.
    if (!r || !r.ok || !s){
      if (++misses < 8) return;
      clearInterval(timer);
      $('go').disabled = false;
      document.body.classList.remove('working');
      $('bar').className = 'bar err';
      $('bar').firstElementChild.style.width = '100%';
      $('phase').textContent = 'Lost contact';
      return showErr(r ? describe(r.status)
                       : 'Lost contact with the server. The job may still be running.');
    }
    misses = 0;

    $('phase').textContent = s.phase;
    $('pct').textContent = Math.round(s.percent) + '%';
    $('bar').firstElementChild.style.width = Math.max(3, s.percent) + '%';
    $('flyer').style.left = Math.max(3, s.percent) + '%';
    $('log').textContent = (s.log||[]).join('\n');
    $('log').scrollTop = $('log').scrollHeight;

    if (s.status === 'running') return;
    clearInterval(timer);
    $('go').disabled = false;
    document.body.classList.remove('working');
    mood(s.status === 'error' ? 'cross' : 'pleased', 5000);

    $('again').style.display = '';
    if (s.status === 'error'){
      $('bar').className = 'bar err';
      $('bar').firstElementChild.style.width = '100%';
      showErr(s.error || 'Job failed - see log.');
      return;
    }
    $('bar').className = 'bar done';
    const audio = (s.files||[]).filter(f => !/\.(jpg|jpeg|png|webp)$/i.test(f));
    $('out').textContent = `${audio.length} track(s) in ${s.output}`;
    $('out').style.display = 'block';
    $('files').innerHTML = '';
    audio.forEach((f,i)=>{
      const d = document.createElement('div');
      d.textContent = f; d.style.animationDelay = (i*0.03)+'s';
      $('files').appendChild(d);
    });
  }, 700);
}

$('again').addEventListener('click', ()=>{
  clearInterval(timer);
  document.body.classList.remove('working');
  mood(null);
  $('panel').classList.remove('on');
  $('again').style.display = 'none';
  $('files').innerHTML=''; $('log').textContent=''; $('out').style.display='none';
  $('phase').textContent='Starting'; $('pct').textContent='0%';
  $('bar').className='bar'; $('bar').firstElementChild.style.width='0';
  clearErr();
  $('url').value=''; $('url').focus();   // folder/artist/album kept - usually the same album
  $('go').disabled = false;
});


/* The cat smirks when you interact with a control. Held while a field has
   focus, and a short beat after a click, so it reads as a reaction rather
   than a flicker. */
let moodOff;
const MOODS = ['smirk','busy','pleased','startled','smile','frown','cross','sleepy',
               'wink','cheeky','grin'];
// Faces that outrank a passing reaction - a status must not be overwritten.
const STATUS = ['busy','pleased','startled','cross'];

function mood(name, ms){
  clearTimeout(moodOff);
  document.body.classList.remove(...MOODS);
  if (name) document.body.classList.add(name);
  if (ms) moodOff = setTimeout(()=>document.body.classList.remove(name), ms);
}

/* One owner for the face. Two systems used to fight: a direct class toggle and
   mood(). focusout re-added the smirk and the next focusin cleared its removal
   timer, so moving between fields left it stuck on permanently. */
/* Reaction pool. Never repeat the last face, or a small set feels stuck. */
const PLAYFUL = ['smirk','smile','wink','cheeky','grin'];
let lastFace = '';
function randomFace(){
  const pick = PLAYFUL.filter(f => f !== lastFace);
  lastFace = pick[Math.floor(Math.random() * pick.length)];
  return lastFace;
}

function inField(el){ return !!(el && el.closest && el.closest('input,select')); }

let heldFace = 'smirk';
document.addEventListener('focusin', e=>{
  if (busyNow()) return;
  // Fields get a random face too, held while focused - always smirking here
  // made most of the set unreachable unless you pressed a button.
  if (inField(e.target)) mood(heldFace = randomFace());
});
document.addEventListener('focusout', e=>{
  if (busyNow()) return;
  if (inField(e.target)) mood(null);
});
document.addEventListener('click', e=>{
  if (busyNow()) return;
  if (e.target.closest('button,.item,.check')) mood(randomFace(), 1400);
});


/* Reachable expressions: hovering Download, a validation slip, and dozing off
   after a while idle. Without these the cat only ever changes mid-download. */
function busyNow(){ return STATUS.some(m => document.body.classList.contains(m)); }

$('go').addEventListener('mouseenter', ()=>{ if (!busyNow()) mood('smile'); });
$('go').addEventListener('mouseleave', ()=>{
  if (busyNow()) return;
  mood(inField(document.activeElement) ? heldFace : null);
});

let dozeTimer;
function stayAwake(){
  if (document.body.classList.contains('sleepy')) mood(null);
  clearTimeout(dozeTimer);
  dozeTimer = setTimeout(()=>{ if (!busyNow()) mood('sleepy'); }, 45000);
}
['pointermove','keydown','click','focusin'].forEach(
  e => document.addEventListener(e, stayAwake, {passive:true}));
stayAwake();

$('go').addEventListener('click', start);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('folder').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
</script>
